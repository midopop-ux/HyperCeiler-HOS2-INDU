name: CI Build

on:
  push:
    branches: [main, os2]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "doc/*"
      - "*.md"
      - "imgs/*"
      - "app/src/assets/**"
      - "crowdin.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build_app:
    runs-on: macos-latest
    name: Build App
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-overwrite-existing: true

      - name: Create Sign File
        shell: bash
        run: |
          touch signing.properties
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo storePassword=${{ secrets.KEY_STORE_PASSWORD }} >> signing.properties
            echo keyAlias=${{ secrets.ALIAS }} >> signing.properties
            echo keyPassword='${{ secrets.KEY_STORE_PASSWORD }}' >> signing.properties
            echo storeFile=../key.jks >> signing.properties
            echo ${{ secrets.SIGNING_KEY }} | base64 --decode > key.jks
          fi
          echo "GIT_ACTOR=${{ secrets.GIT_ACTOR || github.actor }}" >> $GITHUB_ENV
          echo "GIT_TOKEN=${{ secrets.GIT_TOKEN || github.token }}" >> $GITHUB_ENV

      - name: Build with Gradle
        shell: bash
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug
            echo "IS_DEBUG=true" >> $GITHUB_ENV
          else
            ./gradlew assembleRelease
            echo "IS_DEBUG=false" >> $GITHUB_ENV
          fi

      - name: Find APKs
        run: |
          APK_FILE=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "APK_FILE_NAME=$(basename $APK_FILE .apk)" >> $GITHUB_ENV

      - name: Show APKs SHA256
        if: success()
        run: |
          echo "### Build Success" >> $GITHUB_STEP_SUMMARY
          echo "|Artifact|SHA256|" >> $GITHUB_STEP_SUMMARY
          echo "|:---:|:---|" >> $GITHUB_STEP_SUMMARY
          APK_SHA256=($(shasum -a 256 ${{ env.APK_FILE }}))
          echo "|Output|$APK_SHA256" >> $GITHUB_STEP_SUMMARY

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE }}
          compression-level: 9
